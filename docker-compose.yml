services:
  db:
    image: postgres:18-alpine
    container_name: flyrank-db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: widget_db
    ports:
      - 5432:5432
    healthcheck:
      test: [CMD-SHELL, pg_isready -U user -d widget_db]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - db_data:/var/lib/postgresql/
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
  api:
    build: ./backend
    container_name: flyrank-api
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/widget_db
      SUPABASE_URL: ${SUPABASE_URL:?Set SUPABASE_URL in .env}
      SUPABASE_KEY: ${SUPABASE_KEY:?Set SUPABASE_KEY in .env}
      PORT: 3000
    ports:
      - 3000:3000
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build: ./frontend
    container_name: flyrank-frontend
    ports:
      - 3001:80
    depends_on:
      api:
        condition: service_started

volumes:
  db_data:
