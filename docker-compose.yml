services:
 db:
    image: postgres:18-alpine
    container_name: flyrank-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: widget_db
    ports:
      - "5432:5432"
 api:
    build: ./src
    container_name: flyrank-api
    ports:
      - "3000:3000"
